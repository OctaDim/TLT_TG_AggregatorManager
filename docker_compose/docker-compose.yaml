# ######################################################################
# ######################################################################
# ################# DOCKER-COMPOSE COMMANDS: ###########################
# ######################################################################
# ######################################################################

# Execute command if not docker-compose in legacy docker:
# sudo apt install docker-compose-plugin -y

# Check environment variables are ok
# cat ./docker_compose/envs/dev.env

# Execute from certain directory relative to project directory (with loging, not daemon):
# sudo docker compose -f ./docker_compose/docker-compose.yaml up

# Execute as daemon:
# sudo docker compose up -d

# Execute with loging, not daemon:
# sudo docker compose up

# Redefine ip instead of .env value on docker compose start
# MINIO_EXTERNAL_IP=192.168.1.100 docker compose up -d

# See all containers
# docker compose ps

# Check which ports Minio listening (opt.1: via netstat -tulpn):
# display info: tcp   LISTEN  0  4096  192.168.1.100:9000  0.0.0.0:*   users:(("minio",pid=1234))
# sudo netstat -tulpn | grep -E '9000|9001'

# Check which ports Minio listening (opt.2: via ss -tulpn):
# display info: tcp   LISTEN  0  4096  192.168.1.100:9000  0.0.0.0:*   users:(("minio",pid=1234))
# ss -tulpn | grep -E '9000|9001'

# See Minio logs
# docker compose logs minio

# Check certain service healthcheck
# docker inspect minio-server-octadim | grep -A 10 "Health"

# Online logging last 200 records:
# docker compose logs -f --tail=200

# Online logging all previous records and all new online records:
# docker compose logs -f minio

# Execute with loging in separate terminal (as daemon probably):
# docker compose logs -f

# Execute with filters by service (as daemon probably):
# docker compose logs -f minio

# Execute as daemon with log saving to separate file:
# docker compose up -d > docker-compose.log 2>&1

# Execute as daemon with dividing stdout и stderr:
# docker compose up -d > stdout.log 2> stderr.log

# Monitoring log file:
# tail -f docker-compose.log

# Service restart
# docker compose restart minio

# Certain container stooping only
# docker compose stop minio

# Certain container starting only
#docker compose start minio

# Rebuild and start (if Dockerfile has been changed)
# docker compose up -d --build

# Stop all containers (With saving all data)
# docker compose down

# Stop with removing containers (Attention: removes all Minio data!!!)
# docker compose down -v

# Stop with removing containers and images (Attention: removes all Minio data!!!)
# docker compose down --rmi all -v

# See all mounted volumes
# docker volume ls | grep minio

# Volume detailed info
# docker volume inspect docker_compose_minio_mounted_shared
