#version: '3.11'  # Commented to fix "version is obsolete" warning, only for legacy

services:
  #  redis:
  #    volumes:
  #      - redis_cache:/data

  init-minio-dir:
    image: alpine:latest
    container_name: minio-directory-init
    restart: "no"
    volumes:
      - ./../${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}:/data
#      - parent_proj_dir_shared:/parent
#      - ./../:/parent  # Mount/bind Parent directory
    environment:
      MINIO_BASE_DIR: ${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}
    command: |
      sh -c '
        mkdir -p /parent/$${MINIO_BASE_DIR} &&
        echo "✅ Directory /parent/$${MINIO_BASE_DIR} created successfully [OK] ✅"
      '

  minio:
    image: minio/minio:latest
    container_name: minio-server-octadim
    restart: unless-stopped
    env_file:
      - .env  # IMPORTANT: Only run docker_compose directory

    ports:
      - "${MINIO_EXTERNAL_IP:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"     # API port
      - "${MINIO_EXTERNAL_IP:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"  # Web console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?err_MINIO_ROOT_USER_is_required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err_MINIO_ROOT_PASSWORD_is_required}
      # MINIO_ADDRESS: "${MINIO_EXTERNAL_IP:-0.0.0.0}:${MINIO_API_PORT:-9000}"  # Optional, only inside Minio container
      # MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-}
    volumes:
      - ./../${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}:/data
#      - minio_mounted_shared:/data  # Auto directory inside docker volumes system or mounted directory in volumes
      #      - ./${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}:/data  # Relative path from docker-compose.yml
      #      - /absolute/path/to/minio/data:/data  # Absolute server path
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}" --address ":${MINIO_API_PORT:-9000}"
#    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}" --address "${MINIO_EXTERNAL_IP:-0.0.0.0}:${MINIO_API_PORT:-9000}"
    #    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]  # Curl not installed in all Minio images
      #      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - minio_network
    stop_grace_period: 5m  # Soft stop SIGTERM grace period, before killing process
    deploy: # Resources limits
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: # Logging
      driver: "json-file"
      options:
        max-size: "12m"  # File max size limit
        max-file: "50"  # Files max number limit
        compress: "true"  # Compress logs
        mode: "non-blocking"  # Non-blocking mode
        max-buffer-size: "4m"  # Memory buffer size

networks:
  minio_network:
    driver: bridge

volumes:
  parent_proj_dir_shared:
    driver: local
    driver_opts:
      type: none
      device: ./../${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}  # IMPORTANT: relative from docker-compose.yaml run dir, one level higher
      o: bind,shared


  minio_mounted_shared: # Mounted, with share access
    driver: local
    driver_opts:
      type: none
      device: ./../${MINIO_BASE_DIRECTORY:-TEMP_MINIO_FILES}  # IMPORTANT: relative from docker-compose.yaml run dir
      o: bind,shared

